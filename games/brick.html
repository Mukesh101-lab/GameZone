<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Brick Breaker - Play Free Online | GameZone</title>

    <meta name="description"
        content="Play Brick Breaker online for free. Break bricks, keep the ball alive and achieve a high score.">

    <link rel="stylesheet" href="brick.css">

    <!-- Google Analytics -->

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-ZQTNL81HJW"></script>

    <script>
        window.dataLayer = window.dataLayer || [];

        function gtag() {
            dataLayer.push(arguments);
        }

        gtag('js', new Date());

        gtag('config', 'G-ZQTNL81HJW');
    </script>

    <!-- End Google Analytics -->
</head>

<body>

    <!-- Header -->
    <header class="game-header">

        <a href="../index.html" class="back-btn">
            ← GameZone
        </a>

        <h1>🧱 Brick Breaker</h1>

        <div class="score-box">
            Score: <span id="score">0</span>
        </div>

    </header>


    <!-- Advertisement -->
    <div class="ad-container">
        <span>ADVERTISEMENT</span>
    </div>


    <!-- Game -->
    <main class="game-container">

        <div class="game-info">

            <div>
                <span>🏆 High Score</span>
                <strong id="highScore">0</strong>
            </div>

            <div>
                <span>❤️ Lives</span>
                <strong id="lives">3</strong>
            </div>

        </div>


        <div class="canvas-wrapper">

            <canvas id="gameCanvas" width="480" height="520">
            </canvas>


            <!-- Start Screen -->
            <div id="startScreen" class="overlay">

                <h2>🧱 Brick Breaker</h2>

                <p>
                    Break all the bricks!
                </p>

                <button onclick="startGame()">
                    ▶ Start Game
                </button>

            </div>


            <!-- Game Over -->
            <div id="gameOver" class="overlay">

                <h2>Game Over 😢</h2>

                <p>
                    Score:
                    <strong id="finalScore">0</strong>
                </p>

                <button onclick="restartGame()">
                    🔄 Play Again
                </button>

            </div>


            <!-- Win -->
            <div id="winScreen" class="overlay">

                <h2>🎉 You Win!</h2>

                <p>
                    Amazing! All bricks destroyed.
                </p>

                <button onclick="restartGame()">
                    🔄 Play Again
                </button>

            </div>

        </div>


        <!-- Mobile Controls -->
        <div class="mobile-controls">

            <button onclick="movePaddle('LEFT')">
                ⬅️
            </button>

            <button onclick="movePaddle('RIGHT')">
                ➡️
            </button>

        </div>


        <p class="instructions">
            Use <b>←</b> and <b>→</b> arrow keys to move the paddle.
        </p>

    </main>


    <!-- Advertisement -->
    <div class="ad-container bottom-ad">
        <span>ADVERTISEMENT</span>
    </div>


    <script src="brick.js"></script>

</body>

</html>
