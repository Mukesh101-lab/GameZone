<html lang="en">

<head>

    <meta charset="UTF-8">

        content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Play Racing Game online for free on GameZone. Dodge traffic, survive the road and beat your highest score. No download required.">

    <meta name="robots"
        content="index, follow">

    <meta name="author"
        content="GameZone">

    <link rel="canonical"
        href="https://game-zone-blond.vercel.app/games/racing.html">


    <!-- Open Graph -->

    <meta property="og:title"
        content="Racing Game - Play Free Online | GameZone">

    <meta property="og:description"
        content="Dodge traffic and survive as long as possible in this free online racing game.">

    <meta property="og:type"
        content="website">

    <meta property="og:url"
        content="https://game-zone-blond.vercel.app/games/racing.html">

    <meta property="og:site_name"
        content="GameZone">


    <!-- Google Analytics -->

    <script async
        src="https://www.googletagmanager.com/gtag/js?id=G-ZQTNL81HJW">
    </script>

    <script>

        window.dataLayer =
            window.dataLayer || [];

        function gtag() {
            dataLayer.push(arguments);
        }

        gtag('js', new Date());

        gtag('config', 'G-ZQTNL81HJW');

    </script>

    <!-- End Google Analytics -->


    <link rel="stylesheet"
        href="racing.css">

</head>


<body>


    <!-- Header -->

    <header class="game-header">

        <a href="../index.html"
            class="back-btn">
            ← GameZone
        </a>

        <h1>🏎️ Racing Game</h1>

        <div class="score-box">

            Score:
            <span id="score">0</span>

        </div>

    </header>


    <!-- Advertisement -->

    <div class="ad-container">

        <span>
            ADVERTISEMENT
        </span>

    </div>


    <!-- Game -->

    <main class="game-container">


        <!-- Game Info -->

        <div class="game-info">

            <div>

                <span>
                    🏆 High Score
                </span>

                <strong id="highScore">
                    0
                </strong>

            </div>


            <div>

                <span>
                    ❤️ Lives
                </span>

                <strong id="lives">
                    3
                </strong>

            </div>


            <div>

                <span>
                    ⚡ Speed
                </span>

                <strong id="speed">
                    1
                </strong>

            </div>

        </div>


        <!-- Canvas -->

        <div class="canvas-wrapper">

            <canvas
                id="gameCanvas"
                width="400"
                height="650">
            </canvas>


            <!-- Start Screen -->

            <div id="startScreen"
                class="overlay">

                <h2>
                    🏎️ Racing Game
                </h2>

                <p>
                    Dodge the traffic and
                    survive as long as possible!
                </p>

                <button
                    onclick="startGame()">

                    ▶ Start Race

                </button>

            </div>


            <!-- Game Over -->

            <div id="gameOver"
                class="overlay">

                <h2>
                    💥 Game Over
                </h2>

                <p>

                    Your Score:
                    <strong id="finalScore">
                        0
                    </strong>

                </p>

                <button
                    onclick="restartGame()">

                    🔄 Race Again

                </button>

            </div>


            <!-- Win -->

            <div id="winScreen"
                class="overlay">

                <h2>
                    🏆 Amazing!
                </h2>

                <p>
                    You survived the road!
                </p>

                <button
                    onclick="restartGame()">

                    🔄 Race Again

                </button>

            </div>

        </div>


        <!-- Mobile Controls -->

        <div class="mobile-controls">

            <button
                onclick="moveCar('LEFT')">

                ⬅️

            </button>


            <button
                onclick="moveCar('RIGHT')">

                ➡️

            </button>

        </div>


        <p class="instructions">

            Use
            <b>←</b>
            <b>→</b>
            or
            <b>A</b>
            <b>D</b>
            to move your car.

        </p>

    </main>


    <!-- Advertisement -->

    <div class="ad-container bottom-ad">

        <span>
            ADVERTISEMENT
        </span>

    </div>


    <script src="racing.js"></script>

</body>

</html>
