        content="Bubble Shooter - Play Free Online | GameZone">

    <meta property="og:description"
        content="Match colorful bubbles, clear the board and beat your high score in this free Bubble Shooter game.">

    <meta property="og:type" content="website">

    <meta property="og:url"
        content="https://game-zone-blond.vercel.app/games/bubble.html">

    <meta property="og:site_name" content="GameZone">


    <!-- Google Analytics -->

    <script async
        src="https://www.googletagmanager.com/gtag/js?id=G-ZQTNL81HJW">
    </script>

    <script>

        window.dataLayer = window.dataLayer || [];

        function gtag() {
            dataLayer.push(arguments);
        }

        gtag('js', new Date());

        gtag('config', 'G-ZQTNL81HJW');

    </script>


    <!-- Google AdSense -->

    <script async
        src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5052530061389459"
        crossorigin="anonymous">
    </script>


    <link rel="stylesheet" href="bubble.css">

</head>


<body>


    <!-- Header -->

    <header class="game-header">

        <a href="../index.html" class="back-btn">
            ← GameZone
        </a>

        <h1>🫧 Bubble Shooter</h1>

        <div class="score-box">
            Score: <span id="score">0</span>
        </div>

    </header>


    <!-- Advertisement -->

    <div class="ad-container">

        <span>ADVERTISEMENT</span>

    </div>


    <!-- Game -->

    <main class="game-container">


        <div class="game-info">

            <div>

                <span>🏆 High Score</span>

                <strong id="highScore">
                    0
                </strong>

            </div>


            <div>

                <span>🎯 Shots</span>

                <strong id="shots">
                    0
                </strong>

            </div>

        </div>


        <div class="canvas-wrapper">

            <canvas id="gameCanvas"
                width="480"
                height="620">
            </canvas>


            <!-- Start Screen -->

            <div id="startScreen"
                class="overlay">

                <h2>🫧 Bubble Shooter</h2>

                <p>
                    Match 3 or more bubbles!
                </p>

                <button onclick="startGame()">
                    ▶ Start Game
                </button>

            </div>


            <!-- Game Over -->

            <div id="gameOver"
                class="overlay">

                <h2>
                    Game Over 😢
                </h2>

                <p>
                    Score:
                    <strong id="finalScore">
                        0
                    </strong>
                </p>

                <button onclick="restartGame()">
                    🔄 Play Again
                </button>

            </div>


            <!-- Win -->

            <div id="winScreen"
                class="overlay">

                <h2>
                    🎉 You Win!
                </h2>

                <p>
                    Amazing! Board cleared.
                </p>

                <p>
                    Score:
                    <strong id="winScore">
                        0
                    </strong>
                </p>

                <button onclick="restartGame()">
                    🔄 Play Again
                </button>

            </div>

        </div>


        <!-- Mobile Controls -->

        <div class="mobile-controls">

            <button
                onclick="moveAim(-1)">
                ⬅️
            </button>

            <button
                onclick="shootBubble()">
                🎯 SHOOT
            </button>

            <button
                onclick="moveAim(1)">
                ➡️
            </button>

        </div>


        <p class="instructions">

            Move aim with
            <b>←</b>
            <b>→</b>
            and press
            <b>Space</b>
            to shoot.

        </p>


    </main>


    <!-- Advertisement -->

    <div class="ad-container bottom-ad">

        <span>
            ADVERTISEMENT
        </span>

    </div>


    <script src="bubble.js"></script>

</body>

</html>
