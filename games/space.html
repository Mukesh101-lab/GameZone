<body>

    <header class="game-header">

        <a href="../index.html" class="back-btn">
            ← GameZone
        </a>

        <h1>🚀 Space Shooter</h1>

        <div class="score-box">
            Score: <span id="score">0</span>
        </div>

    </header>


    <div class="ad-container">
        <span>ADVERTISEMENT</span>
    </div>


    <main class="game-container">

        <div class="game-info">

            <div>
                <span>🏆 High Score</span>
                <strong id="highScore">0</strong>
            </div>

            <div>
                <span>❤️ Lives</span>
                <strong id="lives">3</strong>
            </div>

        </div>


        <div class="canvas-wrapper">

            <canvas id="gameCanvas" width="480" height="600">
            </canvas>


            <div id="startScreen" class="overlay">

                <h2>🚀 Space Shooter</h2>

                <p>
                    Destroy the enemy ships!
                </p>

                <button onclick="startGame()">
                    ▶ Start Game
                </button>

            </div>


            <div id="gameOver" class="overlay">

                <h2>Game Over 💥</h2>

                <p>
                    Your Score:
                    <strong id="finalScore">0</strong>
                </p>

                <button onclick="restartGame()">
                    🔄 Play Again
                </button>

            </div>

        </div>


        <div class="mobile-controls">

            <button onclick="movePlayer('LEFT')">
                ⬅️
            </button>

            <button onclick="shoot()">
                🔥
            </button>

            <button onclick="movePlayer('RIGHT')">
                ➡️
            </button>

        </div>


        <p class="instructions">
            Use <b>← →</b> or <b>A D</b> to move.
            Press <b>SPACE</b> to shoot.
        </p>
