
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Bubble Shooter - Play Free Online | GameZone</title>

    <meta name="description"
        content="Play Bubble Shooter online for free on GameZone. Aim, shoot and match colorful bubbles to clear the board and beat your high score.">

    <meta name="robots" content="index, follow">
    <meta name="author" content="GameZone">

    <link rel="canonical"
        href="https://game-zone-blond.vercel.app/games/bubble.html">

    <meta property="og:title"
        content="Bubble Shooter - Play Free Online | GameZone">

    <meta property="og:description"
        content="Aim, shoot and match colorful bubbles in this fun free Bubble Shooter game.">

    <meta property="og:type" content="website">

    <meta property="og:url"
        content="https://game-zone-blond.vercel.app/games/bubble.html">

    <meta property="og:site_name" content="GameZone">

    <link rel="stylesheet" href="bubble.css">
</head>

<body>

    <header class="game-header">

        <a href="../index.html" class="back-btn">
            ← GameZone
        </a>

        <h1>🫧 Bubble Shooter</h1>

        <div class="score-box">
            Score: <span id="score">0</span>
        </div>

    </header>


    <main class="game-container">

        <div class="game-info">

            <div>
                <span>🏆 High Score</span>
                <strong id="highScore">0</strong>
            </div>

            <div>
                <span>🎯 Shots</span>
                <strong id="shots">0</strong>
            </div>

        </div>


        <div class="game-wrapper">

            <canvas id="gameCanvas"
                width="480"
                height="700">
            </canvas>


            <div id="startScreen" class="overlay">

                <div class="bubble-logo">
                    🫧
                </div>

                <h2>Bubble Shooter</h2>

                <p>
                    Aim with your finger and release to shoot!
                </p>

                <button onclick="startGame()">
                    ▶ Start Game
                </button>

            </div>


            <div id="gameOver" class="overlay">

                <div class="bubble-logo">
                    💥
                </div>

                <h2>Game Over</h2>

                <p>
                    Score:
                    <strong id="finalScore">0</strong>
                </p>

                <button onclick="restartGame()">
                    🔄 Play Again
                </button>

            </div>


            <div id="winScreen" class="overlay">

                <div class="bubble-logo">
                    🎉
                </div>

                <h2>You Win!</h2>

                <p>
                    Amazing! Board cleared.
                </p>

                <p>
                    Score:
                    <strong id="winScore">0</strong>
                </p>

                <button onclick="restartGame()">
                    🔄 Play Again
                </button>

            </div>

        </div>


        <div class="next-bubble">

            <span>Next</span>

            <div id="nextBubble">
                🟣
            </div>

        </div>


        <p class="instructions">
            👆 Drag your finger to aim • Release to shoot
        </p>

    </main>


    <div class="ad-container">
        <span>ADVERTISEMENT</span>
    </div>


    <script src="bubble.js"></script>

</body>

</html>
